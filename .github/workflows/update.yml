# Every 3 hours: fetch Open-Meteo, record finished days and haze alerts, build the site and
# deploy it to Cloudflare Pages (free; the repository stays private).
#
# Minutes: private repositories get 2,000 free GitHub Actions minutes a month, and each job is
# billed in whole minutes, rounded up. This is ONE job (three jobs would bill three minutes a
# run). 8 runs a day x 30.4 days = 243 runs x 1-2 minutes = 243-486 minutes a month. Hourly
# would be 730 runs = 730-1,460 minutes: too close to the limit. Commits made here with the
# workflow token do not start other workflows, so they cost nothing more.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account id
#   CLOUDFLARE_API_TOKEN  - a token with Account > Cloudflare Pages > Edit only
# Without either, everything else still runs and the deploy step says it was skipped.
# Optional repository variable AIRWATCH_SITE_URL (e.g. https://air.lashvin.com/).
name: update

on:
  schedule:
    - cron: '23 */3 * * *' # 23 minutes past every third hour, UTC (07:23, 10:23, ... MYT)
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Ask for this many past days once (0 = a normal update, at most 92)'
        required: false
        default: '0'

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # push data/history/*.json and data/alerts.json, nothing else
    env:
      PAGES_PROJECT: kl-air-watch
      BACKFILL: ${{ github.event.inputs.backfill || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests (no network, no dependencies)
        run: npm test
      - name: Fetch Open-Meteo and record history and alerts
        run: |
          if [[ ! "$BACKFILL" =~ ^[0-9]{1,2}$ ]]; then echo "bad backfill: $BACKFILL"; exit 1; fi
          if [[ "$BACKFILL" == "0" ]]; then node scripts/airwatch.mjs update --no-cache
          else node scripts/airwatch.mjs update --no-cache --backfill "$BACKFILL"; fi
      - name: Build the site (fails on broken links, inline code, missing attribution)
        id: site
        env:
          AIRWATCH_SITE_URL: ${{ vars.AIRWATCH_SITE_URL }}
        run: node scripts/airwatch.mjs site
      - name: Commit new history days and alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/airwatch.mjs check
          git config user.name "Lashvin Manimaran"
          git config user.email "190336345+VinVirtual@users.noreply.github.com"
          git add data/history
          if [[ -f data/alerts.json && ! -L data/alerts.json ]]; then git add data/alerts.json; fi
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" pull --rebase origin main
          node scripts/airwatch.mjs check
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD:main
      - name: Check the Cloudflare secrets
        id: cf
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ "$HAS_TOKEN" == "true" && "$HAS_ACCOUNT" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Deploy skipped: repository secret CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. The data was still fetched, built and committed. See README, Hosting."
            echo "::warning title=Cloudflare deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() && steps.cf.outputs.ready == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.167.0'
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
