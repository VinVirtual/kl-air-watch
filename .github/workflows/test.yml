name: test

on:
  push:
    branches: [main]
    paths-ignore: ['data/**'] # the scheduled data commits need no test run
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRWATCH_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install (playwright-core only, for the browser test)
        run: npm ci
      - name: Unit tests (recorded responses, no network; feed checks use python3)
        run: npm test
      - name: Committed history and alerts are valid
        run: node scripts/airwatch.mjs check
      - name: Build the site from the recorded example snapshot
        run: |
          cp examples/2026-11-24/latest.json data/latest.json
          node scripts/airwatch.mjs site
      - name: Browser test (strict CSP, charts, 360 px, landmarks, contrast)
        run: npm run test:e2e
